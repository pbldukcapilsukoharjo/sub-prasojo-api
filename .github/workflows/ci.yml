name: Laravel CI/CD

on:
  pull_request:
    branches:
      - main
      - staging

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip
          coverage: none

      - name: Copy .env.example to .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate application key
        run: php artisan key:generate

      - name: Create SQLite database
        run: touch database/database.sqlite

      - name: Run database migrations
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force

      - name: Run tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test

      - name: Send failure notification to Telegram (Test Failed)
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ CI/CD Failed! (Test Stage)

            Repository: ${{ github.repository }}
            Target Branch: ${{ github.base_ref }}
            PR: #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}
            Author: ${{ github.actor }}

            View PR: ${{ github.event.pull_request.html_url }}

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/sub-prasojo-api
          tags: |
            type=ref,event=pr
            type=sha,prefix=${{ github.base_ref }}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Send success notification to Telegram
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ CI/CD Success!

            Repository: ${{ github.repository }}
            Target Branch: ${{ github.base_ref }}
            PR: #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}

            Author: ${{ github.actor }}
            Docker Image Tags:
            - ${{ secrets.DOCKERHUB_USERNAME }}/sub-prasojo-api:pr-${{ github.event.pull_request.number }}
            - ${{ secrets.DOCKERHUB_USERNAME }}/sub-prasojo-api:${{ github.base_ref }}-${{ github.sha }}

            View PR: ${{ github.event.pull_request.html_url }}

      - name: Send failure notification to Telegram (Build Failed)
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ CI/CD Failed! (Build Stage)

            Repository: ${{ github.repository }}
            Target Branch: ${{ github.base_ref }}
            PR: #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}
            Author: ${{ github.actor }}

            View PR: ${{ github.event.pull_request.html_url }}